; 게임 문장 수집. C++의 NSLOCTEXT를 모아 목록과 언어별 .po를 만든다.
; Scripts/Localize-Game.ps1 -Gather가 ASCII 미러에서 돌린다(저장소 경로에 한글이 있다).
[CommonSettings]
SourcePath=%LOCPROJECTROOT%Content/Localization/Game
DestinationPath=%LOCPROJECTROOT%Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
PortableObjectName=Game.po
NativeCulture=ko
CulturesToGenerate=ko
CulturesToGenerate=en
CulturesToGenerate=ja
CulturesToGenerate=zh-Hans
CulturesToGenerate=zh-Hant

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=%LOCPROJECTROOT%Source/IndieGame/
FileNameFilters=*.cpp
FileNameFilters=*.h
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GenerateGatherManifest

[GatherTextStep2]
CommandletClass=GenerateGatherArchive
bPurgeOldEmptyEntries=true

[GatherTextStep3]
CommandletClass=InternationalizationExport
bExportLoc=true
LocalizedTextCollapseMode=ELocalizedTextCollapseMode::IdenticalTextIdAndSource
POFormat=EPortableObjectFormat::Unreal
